name: Release Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
    - uses: actions/checkout@v6

    - name: Update repos
      run: pacman -Syu --needed --noconfirm libseccomp rust systemd-libs systemd pkgconf

    - name: Build
      run: cargo build --release
    - name: Run tests
      run: cargo test --release
