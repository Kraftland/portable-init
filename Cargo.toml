[package]
name = "init"
version = "19.9.9"
edition = "2024"

[dependencies]
ashpd = { version = "0.13.12", features = ["file_chooser", "inhibit"] }
landlock = "0.4.7"
libseccomp = "0.4.0"
nix = { version = "0.31.3", features = ["term", "signal", "process", "ioctl", "fs"] }
systemd = "0.10.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "signal"]}
tokio-util = { version = "0.7.18", features = ["rt"] }
urlencoding = "2.1.3"
zbus = { version = "5.18.0", features = ["async-executor", "async-fs", "async-io", "async-lock", "async-process", "async-task", "tokio"], default-features = false }